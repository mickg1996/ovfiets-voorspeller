name: OV-fiets meting

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  meet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Meting
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: python collect.py
      - name: Pushmeldingen voor fietsmomenten
        if: hashFiles('data/model.joblib') != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python meldingen.py || echo "meldingen overgeslagen"
      - name: Opslaan
        run: |
          git config user.name "ovfiets-bot"
          git config user.email "ovfiets-bot@users.noreply.github.com"
          git add data/snapshots
          [ -f data/meldingen_status.json ] && git add data/meldingen_status.json
          git diff --cached --quiet || git commit -m "meting $(date -u +%FT%TZ)"
          git pull --rebase --quiet && git push
